<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Flow</title>
<style>
body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#f4f1ea;color:#1c1915}
main{max-width:980px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:28px;margin:0 0 6px}.sub{color:#5c564c;margin:0 0 16px}
form{display:flex;gap:8px;max-width:420px}[hidden]{display:none!important}
input,button{font:inherit;padding:10px 12px;border-radius:8px}
input{flex:1;border:1px solid #cfc6b8}button{border:0;background:#1c1915;color:#fff;cursor:pointer}
.err{color:#9f1239;min-height:1.2em}
.site{background:#fff;border-radius:14px;padding:16px 16px 8px;margin:0 0 14px}
.site h2{font-size:18px;margin:0 0 12px}
.step{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:0 0 12px}
.k{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6b645b;padding-top:2px}
.num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.num.miss{font-size:16px;font-weight:600;color:#8a8175}
.bar{height:8px;background:#eee;border-radius:99px;margin:4px 0}
.fill{display:block;height:100%;border-radius:99px}
.detail{color:#5c564c;font-size:13px;margin:2px 0 0}
.pct{color:#6b645b;font-size:12px;font-weight:500}
.visit{background:#1c1915}.signup{background:#166534}.payment{background:#7c3aed}.using{background:#1d4ed8}.action{background:#9a3412}
</style></head><body><main>
<h1>Flow</h1>
<p class="sub">Each site, from the first visit through signup, payment, use, and a real action. A step marked not recorded was never stored. A zero was stored and is empty.</p>
<form id="gate"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button>Open</button></form>
<p class="err" id="err"></p>
<div id="out" hidden></div>
</main>
<script>
const API="https://dciiqcoinlaradmjnkxv.supabase.co/functions/v1/site-people";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjaWlxY29pbmxhcmFkbWpua3h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3OTE1MjksImV4cCI6MjA4OTM2NzUyOX0.wT5Eg40gCnNzNKNfIZj7ge6eDxmXL2vFr-FAw6CTqVc";
const ORDER=["physician-wealth.com","www.death-clock.app","game.death-clock.app","directbookingsitaly.com","finance.raisereadybook.com","avokatfinder.com","greekcafemanager.com","yanni.uk","catchcities.com","raisereadybook.com","calculateapr.com","www.greecesorted.com","dolcevitaroma.com","terrace-sun.netlify.app"];
const err=document.getElementById("err"), out=document.getElementById("out");
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function render(flows){
  const list=(flows||[]).slice().sort(function(a,b){
    const ia=ORDER.indexOf(a.site), ib=ORDER.indexOf(b.site);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  out.innerHTML=list.map(function(flow){
    const nums=flow.steps.map(function(s){return s.count;}).filter(function(n){return n!=null && n>0;});
    const max=Math.max.apply(null,[1].concat(nums));
    let prev=null;
    const steps=flow.steps.map(function(s){
      const known=s.count!=null;
      let pct="";
      if(known && prev!=null && prev>0) pct='<span class="pct">'+Math.round(s.count/prev*100)+'% of the previous counted step</span>';
      if(known) prev=s.count;
      const width=known?Math.max(s.count===0?0:4, Math.round(s.count/max*100)):0;
      const shown=known?String(s.count):"Not recorded";
      return '<div class="step"><div class="k">'+esc(s.label)+'</div><div><div class="num'+(known?"":" miss")+'">'+shown+'</div>'+(known?'<div class="bar"><span class="fill '+esc(s.stage)+'" style="width:'+width+'%"></span></div>':"")+'<div class="detail">'+esc(s.detail)+'</div>'+pct+'</div></div>';
    }).join("");
    return '<section class="site"><h2>'+esc(flow.site)+'</h2>'+steps+'</section>';
  }).join("");
  document.getElementById("gate").hidden=true;
  out.hidden=false;
}
async function openPanel(password){
  err.textContent="";
  const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json",apikey:KEY,authorization:"Bearer "+KEY},body:JSON.stringify({action:"stats",password:password})});
  if(!r.ok){err.textContent="Wrong password";return;}
  const data=await r.json();
  if(!data.flows){err.textContent="Flow data is not ready";return;}
  sessionStorage.setItem("people-ok",password);
  render(data.flows);
}
document.getElementById("gate").addEventListener("submit",function(e){e.preventDefault();openPanel(document.getElementById("pw").value);});
const saved=sessionStorage.getItem("people-ok"); if(saved) openPanel(saved);
</script></body></html>
