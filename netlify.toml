[build]
  publish = "."
  command = "node scripts/netlify-build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https:; connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de https://lz4.overpass-api.de https://z.overpass-api.de https://overpass.kumi.systems https://maps.mail.ru https://overpass.private.coffee; base-uri 'self'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/hotels/"
  to = "/?mode=hotel"
  status = 301
[[redirects]]
  from = "/hosts/"
  to = "/?mode=host"
  status = 301
[[redirects]]
  from = "/solar/"
  to = "/?mode=solar"
  status = 301
[[redirects]]
  from = "/weddings/"
  to = "/?mode=wedding"
  status = 301
[[redirects]]
  from = "/cities/"
  to = "/?mode=city"
  status = 301

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/blog/posts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/stats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/report/*"
  [headers.values]
    X-Robots-Tag = "noindex"
